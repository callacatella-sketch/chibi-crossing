name: Test (GDScript + C++)

# Esegue la test-suite dependency-free (tests/test_runner.gd) a ogni push.
# Poiché i binari della GDExtension NON sono versionati, prima compila il cuore
# C++ per Linux (target debug) così Godot può caricarlo e i test possono usare
# le classi C++ (SurvivalComponent, GridManager, ...).

on:
  push:
    branches: [main]
    paths:
      - 'scenes/**'
      - 'src/**'
      - 'tests/**'
      - 'project.godot'
      - 'SConstruct'
      - 'chibi_crossing.gdextension'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    name: Esegui la test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con submodule godot-cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa SCons
        run: python -m pip install --upgrade pip scons

      - name: Compila il cuore C++ (Linux, debug)
        run: scons platform=linux target=template_debug -j4

      - name: Setup Godot (senza export templates: servono solo per esportare)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Esegui i test
        run: godot --headless --path . --script res://tests/test_runner.gd
