name: Test (GDScript + C++)

# Esegue la test-suite dependency-free (tests/test_runner.gd).
#
# Gira su macOS perche' i test caricano l'intero progetto, che dipende da DUE
# estensioni native: il cuore C++ chibi (lo compiliamo qui) e l'addon
# lua-gdextension (i cui binari sono committati solo per macOS/Windows, non
# Linux). Su macOS entrambi sono presenti, come nell'ambiente di sviluppo.
#
# Passo chiave: `--import` prima dei test. In modalita' --script Godot carica le
# GDExtension solo se esiste la cache .godot/extension_list.cfg, che pero' e'
# gitignored; l'import la (ri)genera, cosi' le classi C++ risultano registrate.
#
# Trigger mirati (i runner macOS costano 10x e i backup automatici sono
# frequenti): solo quando cambia il codice realmente coperto dai test.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scenes/world/CozyWorld.gd'
      - 'scenes/npc/ChibiDNA.gd'
      - 'SConstruct'
      - 'project.godot'
      - 'chibi_crossing.gdextension'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    name: Esegui la test-suite
    runs-on: macos-latest
    steps:
      - name: Checkout (con submodule godot-cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa SCons
        run: python -m pip install --upgrade pip scons

      - name: Compila il cuore C++ (macOS universale, debug)
        run: scons platform=macos arch=universal target=template_debug -j4

      - name: Setup Godot (senza export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Genera la cache di import (registra le GDExtension)
        run: godot --headless --path . --import || true

      - name: Esegui i test
        run: godot --headless --path . --script res://tests/test_runner.gd
