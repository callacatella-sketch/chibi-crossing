name: Test (GDScript + C++)

# Esegue la test-suite dependency-free (tests/test_runner.gd).
#
# Gira su macOS perche' i test caricano l'intero progetto, che dipende da DUE
# estensioni native: il cuore C++ chibi (lo compiliamo qui) e l'addon
# lua-gdextension (i cui binari sono committati solo per macOS/Windows, non
# Linux). Su macOS entrambi sono presenti, come nell'ambiente di sviluppo.
#
# Passo chiave: `--import` prima dei test. In modalita' --script Godot carica le
# GDExtension solo se esiste la cache .godot/extension_list.cfg, che pero' e'
# gitignored; l'import la (ri)genera, cosi' le classi C++ risultano registrate.
#
# Trigger mirati (i runner macOS costano 10x e i backup automatici sono
# frequenti), ma non TROPPO mirati: i test caricano l'intero progetto, quindi
# qualunque script di gioco può romperli. Elencare i singoli file (com'era:
# solo CozyWorld.gd e ChibiDNA.gd) lasciava scoperti 14 dei 16 script coperti
# dalla suite — e i loro fallimenti arrivavano solo a valle. Si filtra per
# CARTELLA: se cambia del codice, la suite gira.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scenes/**'
      - 'systems/**'
      - 'audio/**'
      - 'shaders/**'
      - 'SConstruct'
      - 'project.godot'
      - 'chibi_crossing.gdextension'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.1

jobs:
  test:
    name: Esegui la test-suite
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # I sottomoduli si tirano giu' a mano, e SOLO quelli che servono. Da
      # quando c'e' llama.cpp (Fase 5, `src/thirdparty/llama.cpp`) un
      # `submodules: recursive` porterebbe 200 MB di motore di inferenza dentro
      # ogni job che compila il gioco SENZA di lui — cioe' dentro tutti tranne
      # uno. Qui serve godot-cpp e basta.
      - name: Sottomodulo godot-cpp
        run: git submodule update --init --depth 1 godot-cpp

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa SCons
        run: python -m pip install --upgrade pip scons

      - name: Compila il cuore C++ (macOS universale, debug)
        run: scons platform=macos arch=universal target=template_debug -j4

      - name: Setup Godot (senza export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Genera la cache di import (registra le GDExtension)
        run: godot --headless --path . --import || true

      - name: Esegui i test
        run: godot --headless --path . --script res://tests/test_runner.gd

  # --------------------------------------------------------------------------
  # FASE 5 — LA STESSA SUITE, sul cuore compilato CON llama.cpp dentro.
  #
  # E' la prova della promessa: «il gioco deve funzionare identico senza» ha un
  # gemello che nessuno guarda mai, ed e' «e identico CON». Il job qui sopra
  # prova un binario in cui `LlmLocale` non esiste; questo prova quello in cui
  # esiste — stessi test, stesso numero di asserzioni. Ed e' anche l'unico
  # posto in cui le asserzioni condizionate di `test_llm_terreno.gd` (quelle
  # che interrogano il registro dei backend di ggml) girano davvero: senza
  # questo job sarebbero un ramo di codice che nessuno esegue.
  # --------------------------------------------------------------------------
  test-llm:
    name: Esegui la test-suite (con llama.cpp)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Il SHA a cui e' pinnato llama.cpp
        id: pin
        shell: bash
        run: echo "sha=$(git ls-tree HEAD src/thirdparty/llama.cpp | awk '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Sottomoduli (godot-cpp + llama.cpp)
        run: git submodule update --init --depth 1 godot-cpp src/thirdparty/llama.cpp

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installa SCons e Ninja
        run: python -m pip install --upgrade pip scons ninja

      - name: Cache della build di llama.cpp
        uses: actions/cache@v4
        with:
          # Solo le librerie INSTALLATE, non le centinaia di megabyte di
          # oggetti: il timbro nel SConstruct guarda proprio queste due cose
          # (`inst/lib` pieno + `timbro.json` che combacia) e salta tutto il
          # resto senza nemmeno chiamare cmake.
          path: |
            src/thirdparty/llm-build/*/inst
            src/thirdparty/llm-build/*/timbro.json
          key: llm-macos-${{ steps.pin.outputs.sha }}-${{ hashFiles('SConstruct') }}

      - name: Compila il cuore C++ con llama.cpp (macOS universale, debug)
        run: scons platform=macos arch=universal target=template_debug llm=yes -j4

      - name: Setup Godot (senza export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: false

      - name: Genera la cache di import (registra le GDExtension)
        run: godot --headless --path . --import || true

      - name: Esegui i test
        run: godot --headless --path . --script res://tests/test_runner.gd
