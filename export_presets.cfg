[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
; I FILE DI LICENZA ENTRANO NEL .pck, e non sono una risorsa di Godot: un .txt
; non viene importato, quindi "all_resources" da solo NON lo porta dentro e la
; schermata «Note legali» del gioco troverebbe la cartella vuota. Da qui
; passano solo le copie destinate a chi gioca (misc/licenze/), non tutto misc/.
;
; ⚠️ Questo NON basta a rispettare la Sezione 3.1 dei Gemma Terms of Use: un
; file dentro un .pck (per giunta EMBEDDED nell'.exe su Windows) non
; «accompagna» la distribuzione in nessun senso utile a chi la riceve. Le
; stesse copie vengono messe ANCHE accanto all'eseguibile da release.yml.
; Servono tutte e due: una la legge il gioco, l'altra la legge una persona.
include_filter="misc/licenze/*.txt"
exclude_filter=""
export_path="build/windows/ChibiCrossing.exe"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=true
application/icon=""
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version=""
application/product_version=""
application/company_name="GenesisBloomInteractive"
application/product_name="ChibiCrossing"
application/file_description="Chibi Crossing"
application/copyright="Copyright (c) 2026 Vittorio Dario Capogna — GenesisBloomInteractive. Tutti i diritti riservati."
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
codesign/enable=false
ssh_remote_deploy/enabled=false

